name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - run: cargo clippy --features "wgpu,cli,hub" -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Compile tests
        run: cargo test --features "wgpu,cli,hub" --no-run
      - name: Run tests (GPU-dependent tests skipped — no adapter in CI)
        run: |
          cargo test --features "wgpu,cli,hub" -- \
            --skip "gguf::" \
            --skip "models::adapter::tests" \
            --skip "models::decoder::tests" \
            --skip "models::encoder::tests" \
            --skip "models::layers" \
            --skip "models::time_embedding::tests" \
            --skip "models::voxtral::tests" \
            --skip "tts::" \
            --skip "test_q4_"
